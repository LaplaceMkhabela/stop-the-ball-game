<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stop the Ball Game</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c1020">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ad">
        <video id="adBg" src="ad.mp4" playsinline muted preload="auto" aria-hidden="true"></video>
        <div id="adGlass"></div>
        <video id="adVideo" src="ad.mp4" playsinline muted preload="auto"></video>
        <button id="adPlayButton" class="hidden">Play</button>
        <div id="adHint" class="hidden">Tap anywhere to continue</div>
    </div>
    <div id="menu" class="hidden">
        <h1>Stop the Ball Game</h1>
        <p>Choose a version to play</p>
        <div id="modeList">
            <button class="mode-button" data-href="classic/">
                <span class="mode-name">Classic</span>
                <span class="mode-desc">The original reflex game</span>
            </button>
            <button class="mode-button" data-href="new/">
                <span class="mode-name">New Version</span>
                <span class="mode-desc">10 levels, shapes &amp; decoys</span>
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
