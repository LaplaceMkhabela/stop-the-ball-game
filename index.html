<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stop the Ball Game</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07060f">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ad">
        <canvas id="adCanvas" aria-hidden="true"></canvas>
        <div id="adGlass"></div>
        <video id="adVideo" src="ad.mp4" playsinline muted preload="auto" disablepictureinpicture disableremoteplayback></video>
        <button id="adPlayButton" class="hidden">Play</button>
        <div id="adHint" class="hidden">Tap anywhere to continue</div>
    </div>

    <div id="menu" class="container hidden">
        <div class="floating-char char-circle">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>
        </div>
        <div class="floating-char char-star">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>
        </div>

        <h1>Stop the Ball Game</h1>
        <p>Choose a version to play</p>

        <div class="cards-wrapper">
            <a class="mode-card" href="classic/">
                <div class="mode-title">Classic</div>
                <div class="mode-desc">The original reflex game</div>
            </a>
            <a class="mode-card" href="new/">
                <div class="mode-title">New Version</div>
                <div class="mode-desc">10 levels, shapes &amp; decoys</div>
            </a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
